<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversations in Amed — MriyaWorks</title>
<meta name="description" content="A free, non-commercial trainer for non-violent communication by MriyaWorks.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифти не блокують рендер і виконання скриптів -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Commissioner:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Commissioner:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="wrap">
  <a href="../" style="display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);text-decoration:none;margin-bottom:10px">← Conversations in Amed · MriyaWorks</a>
  <header class="top">
    <div>
      <h1 id="pageTitle">Розмови в Амеді</h1>
      <div class="proto" id="pageSub"></div>
    </div>
    <div class="top-ctl">
      <div class="langsw" id="langSw" role="group"></div>
      <button type="button" class="backbtn hidden" id="backBtn"></button>
      <label class="hint-toggle hidden" id="hardWrap"><input type="checkbox" id="hardMode"> <span id="hardTxt"></span></label>
      <label class="hint-toggle"><input type="checkbox" id="hints" checked> <span id="hintsTxt"></span></label>
    </div>
  </header>

  <div class="menu" id="menu"></div>

  <div id="game" class="hidden">
    <div class="status" id="statusBox"></div>
    <div class="timeline" id="timeline"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="options" id="options"></div>
  </div>

  <footer id="footer"></footer>
</div>

<!-- Порядок важливий: простір імен → ядро → мови/маніфест → рушій → UI → запуск.
     Історії (stories/<id>/<lang>.js) догружає js/core/loader.js лише для активної мови. -->
<script src="js/core/namespace.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/stories.js"></script>
<script src="js/core/loader.js"></script>
<script src="locales/languages.js"></script>
<script src="locales/en.js"></script>
<script src="locales/uk.js"></script>
<script src="locales/ru.js"></script>
<script src="locales/be.js"></script>
<script src="locales/id.js"></script>
<script src="stories/manifest.js"></script>
<script src="js/engine/rules.js"></script>
<script src="js/engine/session.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/scroll.js"></script>
<script src="js/ui/presenter.js"></script>
<script src="js/ui/chat.js"></script>
<script src="js/ui/status.js"></script>
<script src="js/ui/controls.js"></script>
<script src="js/ui/ending.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
